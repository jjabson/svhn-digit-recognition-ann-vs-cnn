[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svhn-ml-system"
version = "0.1.0"
description = "SVHN ML inference, evaluation, reliability, and MCP system"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "mcp_server*"]